<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn AEO Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04060d;
    --ink: #eef3ff;
    --muted: #a9b4cc;
    --cyan: #6fe3ff;
    --gold: #ffc76b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }

  .hero { position: relative; height: 100svh; min-height: 560px; overflow: hidden; background: var(--bg); }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 42%, transparent 45%, rgba(4,6,13,.8) 100%),
      linear-gradient(to bottom, transparent 50%, rgba(4,6,13,.82) 100%);
  }
  @media (max-aspect-ratio: 4/5) {
    .vignette { background:
      radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(4,6,13,.8) 100%),
      linear-gradient(to bottom, transparent 30%, rgba(4,6,13,.92) 72%); }
  }
  .flash { position: absolute; inset: 0; pointer-events: none; background: #fff6e4; opacity: 0; }

  .copy {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 0 16px 9vh; text-align: center;
    opacity: 0; transform: translateY(18px);
    transition: opacity 1.4s ease, transform 1.4s ease;
    pointer-events: none;
  }
  .copy.show { opacity: 1; transform: none; pointer-events: auto; }
  .copy::before {
    content: ""; position: absolute; z-index: -1; left: 50%; bottom: 0;
    width: min(900px, 140vw); height: 120%; transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 60%, rgba(4,6,13,.72), transparent 68%);
  }
  .eyebrow { font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); margin: 0 0 1rem; }
  h1 {
    font-family: 'Instrument Serif', Georgia, serif; font-weight: 400;
    font-size: clamp(3.2rem, 9vw, 7.5rem); line-height: .92; margin: 0 0 .35em;
    text-shadow: 0 0 40px rgba(111,227,255,.25);
  }
  h1 em { color: var(--gold); text-shadow: 0 0 40px rgba(255,199,107,.45); }
  .sub { max-width: 36rem; margin: 0 auto 1.6rem; color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.12rem); line-height: 1.55; }
  .cta {
    display: inline-flex; align-items: center; gap: .6em;
    padding: .95em 1.7em; border-radius: 999px;
    background: linear-gradient(180deg, #ffd893, #f0a93c); color: #1a1205;
    font-weight: 600; text-decoration: none;
    box-shadow: 0 0 0 1px rgba(255,214,140,.5), 0 10px 40px rgba(255,180,80,.35);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .cta:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(255,214,140,.7), 0 14px 50px rgba(255,180,80,.5); }
  .note { margin-top: .8rem; font-size: .85rem; color: var(--muted); }

  .replay {
    position: absolute; right: 16px; top: 16px;
    background: rgba(255,255,255,.06); color: var(--muted);
    border: 1px solid rgba(255,255,255,.12); border-radius: 999px;
    padding: .45em 1em; font: 500 .8rem Inter, sans-serif; cursor: pointer;
  }
  .replay:hover { color: var(--ink); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<section class="hero" id="hero">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
  <button class="replay" id="replay" type="button">Replay intro</button>
  <div class="copy" id="copy">
    <p class="eyebrow">Answer Engine Optimization</p>
    <h1>Learn<br><em>AEO</em></h1>
    <p class="sub">From search boxes to AI answers. Learn how ChatGPT, Perplexity and Google AI Overviews choose who to cite, and how to become the answer.</p>
    <a class="cta" href="#">Start My First Lesson <span aria-hidden="true">→</span></a>
    <p class="note">Free · 10 minutes · no card needed</p>
  </div>
</section>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- timeline ----------
// 0.5–2.5s  question types into the search bar
// 2.7s      light cracks through the seam
// 2.9–4.4s  bar swings open like double doors
// 4.4–10s   camera flies through into the city of answers
// 10s+      slow orbit around the cited source (loop)
const QUESTION = 'How do I get cited by ChatGPT?';
const OPEN_START = 2.9, OPEN_END = 4.4, INTRO_END = 10.0, COPY_AT = 8.6;

const params = new URLSearchParams(location.search);
const seekTime = params.has('t') ? parseFloat(params.get('t')) : null; // ?t=6 freezes at 6s (for screenshots)
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp01 = v => Math.min(1, Math.max(0, v));
const phase = (t, a, b) => clamp01((t - a) / (b - a));
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const rand = (a, b) => a + Math.random() * (b - a);

const COL = {
  bg: new THREE.Color(0x04060d),
  cyan: new THREE.Color(0x6fe3ff),
  gold: new THREE.Color(0xffc76b),
};

// ---------- renderer ----------
const hero = document.getElementById('hero');
const canvas = document.getElementById('scene');
const isSmall = Math.min(innerWidth, innerHeight) < 700;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isSmall ? 1.5 : 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = COL.bg;
scene.fog = new THREE.FogExp2(COL.bg, 0.016);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.7, 0.55, 0.32);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- shared textures ----------
function radialTexture(inner = 'rgba(255,255,255,1)', outer = 'rgba(255,255,255,0)') {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, inner); grad.addColorStop(.25, 'rgba(255,255,255,.35)'); grad.addColorStop(1, outer);
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const dotTex = radialTexture();

// ---------- dust ----------
{
  const n = isSmall ? 900 : 1600;
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = rand(-70, 70); pos[i * 3 + 1] = rand(-6, 40); pos[i * 3 + 2] = rand(-180, 20);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var dust = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.12, map: dotTex, color: 0x9fdfff, transparent: true, opacity: .55,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  scene.add(dust);
}

// ---------- search bar (the door) ----------
const barCanvas = document.createElement('canvas');
barCanvas.width = 2048; barCanvas.height = 256;
let fontsReady = false;
document.fonts.ready.then(() => { fontsReady = true; lastBarKey = ''; });

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function drawBar(text, caret) {
  const g = barCanvas.getContext('2d'), W = barCanvas.width, H = barCanvas.height;
  g.clearRect(0, 0, W, H);
  roundRect(g, 14, 14, W - 28, H - 28, 114);
  g.fillStyle = 'rgba(14,24,46,0.92)'; g.fill();
  const border = g.createLinearGradient(0, 0, W, 0);
  border.addColorStop(0, '#6fe3ff'); border.addColorStop(.55, '#b9ecff'); border.addColorStop(1, '#ffc76b');
  g.save(); g.shadowColor = '#6fe3ff'; g.shadowBlur = 24; g.lineWidth = 6; g.strokeStyle = border; g.stroke(); g.restore();
  // magnifier
  g.strokeStyle = '#9fe9ff'; g.lineWidth = 9;
  g.beginPath(); g.arc(150, 118, 34, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(175, 143); g.lineTo(205, 173); g.stroke();
  // question
  g.font = `500 86px ${fontsReady ? 'Inter' : 'system-ui'}, sans-serif`;
  g.fillStyle = '#eaf3ff'; g.textBaseline = 'middle';
  g.fillText(text, 260, H / 2 + 4);
  if (caret) {
    const w = g.measureText(text).width;
    g.fillStyle = '#6fe3ff'; g.fillRect(268 + w, H / 2 - 44, 7, 90);
  }
  // send button
  g.fillStyle = 'rgba(255,199,107,0.95)';
  g.beginPath(); g.arc(W - 128, H / 2, 62, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#1a1205'; g.lineWidth = 10; g.lineCap = 'round';
  g.beginPath(); g.moveTo(W - 128, H / 2 + 30); g.lineTo(W - 128, H / 2 - 28); g.stroke();
  g.beginPath(); g.moveTo(W - 154, H / 2 - 4); g.lineTo(W - 128, H / 2 - 30); g.lineTo(W - 102, H / 2 - 4); g.stroke();
}

const texL = new THREE.CanvasTexture(barCanvas), texR = new THREE.CanvasTexture(barCanvas);
for (const t of [texL, texR]) { t.colorSpace = THREE.SRGBColorSpace; t.repeat.set(.5, 1); t.anisotropy = 4; }
texR.offset.set(.5, 0);

const bar = new THREE.Group();
scene.add(bar);
function makeDoor(tex, side) {
  const pivot = new THREE.Group();
  pivot.position.x = side * -4; // hinge on the outer edge
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(4, 1),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, toneMapped: false, fog: false }));
  mesh.position.x = side * 2;
  pivot.add(mesh); bar.add(pivot);
  return pivot;
}
const doorL = makeDoor(texL, 1), doorR = makeDoor(texR, -1);

const seamMat = new THREE.ShaderMaterial({
  uniforms: { uI: { value: 0 }, uC: { value: new THREE.Color(1.0, 0.86, 0.6) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `varying vec2 vUv; uniform float uI; uniform vec3 uC;
    void main(){ float dx = abs(vUv.x-.5)*2.; float dy = abs(vUv.y-.5)*2.;
      float a = pow(1.-dx, 3.) * pow(1.-dy, 1.5) * uI;
      gl_FragColor = vec4(uC * a * 3., a); }`,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
});
const seam = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), seamMat);
seam.position.z = -0.05;
bar.add(seam);

const barHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: dotTex, color: COL.cyan, transparent: true, opacity: .18,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
}));
barHalo.scale.set(16, 5, 1); barHalo.position.z = -0.1;
bar.add(barHalo);

// dark wall with a doorway the size of the bar: hides the city until the doors open
{
  const wall = new THREE.Shape();
  wall.moveTo(-200, -200); wall.lineTo(200, -200); wall.lineTo(200, 200); wall.lineTo(-200, 200); wall.lineTo(-200, -200);
  const hole = new THREE.Path();
  hole.moveTo(-3.95, -.47); hole.lineTo(3.95, -.47); hole.lineTo(3.95, .47); hole.lineTo(-3.95, .47); hole.lineTo(-3.95, -.47);
  wall.holes.push(hole);
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(wall), new THREE.MeshBasicMaterial({ color: COL.bg, fog: false, transparent: true }));
  mesh.position.z = -0.25;
  bar.add(mesh);
  var wallMat = mesh.material;
}

// ---------- city of answers ----------
const GROUND_Y = -6;
const SOURCE = new THREE.Vector3(0, GROUND_Y, -90);
const SOURCE_TOP = new THREE.Vector3(0, 13, -90);

// ground grid
{
  const mat = new THREE.ShaderMaterial({
    uniforms: { uFog: { value: COL.bg }, uSrc: { value: SOURCE } },
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `varying vec3 vW; uniform vec3 uFog; uniform vec3 uSrc;
      float grid(vec2 p){ vec2 g = abs(fract(p - .5) - .5) / fwidth(p); return 1. - min(min(g.x, g.y), 1.); }
      void main(){
        float l = grid(vW.xz / 6.);
        float d = length(vW.xz - uSrc.xz);
        vec3 col = vec3(.25,.75,1.) * l * .35 + vec3(1.,.7,.35) * exp(-d * .14) * .3;
        float dist = length(vW - cameraPosition);
        float fog = 1. - exp(-pow(.016 * dist, 2.));
        gl_FragColor = vec4(mix(col + uFog, uFog, fog), 1.);
      }`,
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), mat);
  ground.rotation.x = -Math.PI / 2; ground.position.set(0, GROUND_Y, -80);
  scene.add(ground);
}

// towers: footprints with setback tiers and the odd antenna
const towers = [];   // one per building, used to anchor the citation streams
const boxes = [];    // every box drawn (base, tiers, antenna masts)
const beacons = [];  // antenna tip lights
{
  // facade styles: 0 window grid, 1 floor bands, 2 vertical light strips, 3 antenna mast
  for (let x = -66; x <= 66; x += 6) {
    for (let z = -16; z >= -176; z -= 6) {
      if (Math.abs(x) < 7) continue;                                  // keep the flight avenue clear
      if (Math.hypot(x - SOURCE.x, z - SOURCE.z) < 13) continue;      // plaza around the source
      if (Math.random() < .4) continue;
      const bx = x + rand(-1, 1), bz = z + rand(-1, 1);
      const w = rand(2.4, 4.4), d = rand(2.4, 4.4);
      let h = 3 + Math.pow(Math.random(), 1.6) * 22 + Math.min(Math.abs(x), 30) * .12;
      if (Math.hypot(bx - SOURCE.x, bz - SOURCE.z) < 34) h = Math.min(h, 8); // low district around the source keeps the orbit clear
      const r = Math.random(), style = r < .5 ? 0 : r < .78 ? 1 : 2;
      const seed = Math.random();
      let top = GROUND_Y + h;
      boxes.push({ x: bx, z: bz, w, h, d, y: GROUND_Y + h / 2, style, seed });
      if (h > 9 && Math.random() < .6) {
        const w2 = w * rand(.55, .78), d2 = d * rand(.55, .78), h2 = h * rand(.18, .38);
        boxes.push({ x: bx, z: bz, w: w2, h: h2, d: d2, y: top + h2 / 2, style, seed: seed + .37 });
        top += h2;
        if (Math.random() < .4) {
          const w3 = w2 * .6, d3 = d2 * .6, h3 = h2 * .55;
          boxes.push({ x: bx, z: bz, w: w3, h: h3, d: d3, y: top + h3 / 2, style, seed: seed + .71 });
          top += h3;
        }
      }
      if (h > 13 && Math.random() < .4) {
        const ah = rand(2, 4.5);
        boxes.push({ x: bx, z: bz, w: .14, h: ah, d: .14, y: top + ah / 2, style: 3, seed });
        beacons.push(bx, top + ah + .1, bz);
      }
      towers.push({ x: bx, z: bz, top });
    }
  }

  const geo = new THREE.BoxGeometry(1, 1, 1);
  geo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(new Float32Array(boxes.map(b => b.seed)), 1));
  geo.setAttribute('aStyle', new THREE.InstancedBufferAttribute(new Float32Array(boxes.map(b => b.style)), 1));
  geo.setAttribute('aSize', new THREE.InstancedBufferAttribute(new Float32Array(boxes.flatMap(b => [b.w, b.h, b.d])), 3));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uFog: { value: COL.bg }, uSrc: { value: SOURCE }, uGround: { value: GROUND_Y } },
    vertexShader: `attribute float aSeed; attribute float aStyle; attribute vec3 aSize;
      varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec3 vSize; varying float vSeed; varying float vStyle;
      void main(){ mat4 m = modelMatrix * instanceMatrix; vec4 w = m * vec4(position,1.);
        vW = w.xyz; vL = position; vN = normalize(mat3(m) * normal);
        vSize = aSize; vSeed = aSeed; vStyle = aStyle;
        gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec3 vSize; varying float vSeed; varying float vStyle;
      uniform float uTime; uniform vec3 uFog; uniform vec3 uSrc; uniform float uGround;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      void main(){
        vec3 trim = vec3(.3,.8,1.);
        float side = 1. - abs(vN.y);
        float roof = step(.5, vN.y);
        bool xFace = abs(vN.x) > .5;
        float faceId = xFace ? (vN.x > 0. ? 1. : 2.) : (vN.z > 0. ? 3. : 4.);
        float faceW = xFace ? vSize.z : vSize.x;
        float across = (xFace ? vL.z : vL.x) * faceW;            // meters from the face center
        float edge = faceW * .5 - abs(across);                    // meters to the vertical corner
        float fromTop = (.5 - vL.y) * vSize.y;                    // meters below the roofline
        float hNorm = clamp((vW.y - uGround) / 34., 0., 1.);

        // dark glass that lifts slightly with height, plus faint vertical mullions
        vec3 col = mix(vec3(.01,.016,.032), vec3(.028,.05,.09), hNorm);
        col += trim * smoothstep(.44, .5, abs(fract(across * 1.25) - .5)) * side * .05;

        // lights
        vec2 g = vec2(across * 1.25, vW.y * 1.6);
        vec2 cell = floor(g), f = fract(g);
        float rnd = hash(cell + vSeed * 41. + faceId * 7.);
        float win = 0.;
        if (vStyle < .5)        win = step(.2,f.x) * step(f.x,.8) * step(.28,f.y) * step(f.y,.72) * step(.74, rnd);
        else if (vStyle < 1.5)  win = step(.32,f.y) * step(f.y,.6) * step(.5, hash(vec2(cell.y, vSeed * 13. + faceId))) * (.55 + .45 * rnd);
        else if (vStyle < 2.5)  win = step(.42,f.x) * step(f.x,.58) * step(.4, hash(vec2(cell.x, floor(cell.y / 5.)) + vSeed * 9. + faceId));
        win *= side * step(.25, edge) * step(.35, fromTop);       // dark margin at corners and roof
        float flick = .8 + .2 * sin(uTime * .5 + rnd * 40.);
        vec3 wc = mix(vec3(.45,.85,1.), vec3(1.,.8,.5), step(.82, hash(cell * 1.3 + vSeed)));
        col += wc * win * flick * .9;

        // neon trim on the corners and roofline, brighter higher up
        float cornerGlow = (1. - smoothstep(0., .07, edge)) * side;
        float roofGlow = (1. - smoothstep(0., .1, fromTop)) * side;
        float rimTop = min(vSize.x * .5 - abs(vL.x * vSize.x), vSize.z * .5 - abs(vL.z * vSize.z));
        float roofRim = (1. - smoothstep(0., .1, rimTop)) * roof;
        col += trim * (cornerGlow * .3 + roofGlow * .8 + roofRim * .7) * (.35 + .65 * hNorm);

        // warm light from the cited source on faces turned toward it
        vec3 toSrc = uSrc + vec3(0., 12., 0.) - vW;
        float dS = length(toSrc);
        col += vec3(1.,.66,.3) * max(dot(vN, toSrc / dS), 0.) * exp(-dS * .06) * .3;

        if (vStyle > 2.5) col = vec3(.04,.06,.1) + trim * .12;   // antenna mast

        float dist = length(vW - cameraPosition);
        float fog = 1. - exp(-pow(.016 * dist, 2.));
        gl_FragColor = vec4(mix(col, uFog, fog), 1.);
      }`,
  });
  var towerMat = mat;
  const mesh = new THREE.InstancedMesh(geo, mat, boxes.length);
  const m = new THREE.Matrix4();
  boxes.forEach((b, i) => {
    m.makeScale(b.w, b.h, b.d).setPosition(b.x, b.y, b.z);
    mesh.setMatrixAt(i, m);
  });
  scene.add(mesh);

  const beaconGeo = new THREE.BufferGeometry();
  beaconGeo.setAttribute('position', new THREE.Float32BufferAttribute(beacons, 3));
  var beaconMat = new THREE.PointsMaterial({
    size: .9, map: dotTex, color: new THREE.Color(1, .35, .28).multiplyScalar(1.6), transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  });
  scene.add(new THREE.Points(beaconGeo, beaconMat));
}

// the cited source: a golden crystal on a plinth with a beam of light
{
  for (const [r, o] of [[5, .9], [8, .45], [12, .22]]) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(r - .12, r, 96),
      new THREE.MeshBasicMaterial({ color: COL.gold, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
    ring.rotation.x = -Math.PI / 2; ring.position.set(SOURCE.x, GROUND_Y + .05, SOURCE.z);
    scene.add(ring);
  }

  const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(1.6, 0),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(1.0, 0.7, 0.3).multiplyScalar(.9), toneMapped: false }));
  crystal.scale.set(1, 3.6, 1);
  crystal.position.set(SOURCE.x, 5.8, SOURCE.z);
  scene.add(crystal);
  var sourceCrystal = crystal;

  const beamMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `varying vec2 vUv; uniform float uTime;
      void main(){ float a = pow(1. - vUv.y, 2.2) * (.55 + .1 * sin(uTime * 2. + vUv.y * 30.));
        gl_FragColor = vec4(vec3(1.,.78,.45) * a * .9, a); }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false,
  });
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.5, 1.2, 120, 24, 1, true), beamMat);
  beam.position.set(SOURCE.x, 10 + 60, SOURCE.z);
  scene.add(beam);
  var beamMaterial = beamMat;

  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: dotTex, color: COL.gold, transparent: true, opacity: .45,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
  }));
  halo.scale.set(16, 16, 1); halo.position.copy(SOURCE_TOP).setY(6);
  scene.add(halo);
}

// citation streams: light flowing from towers into the source
const streams = [];
{
  const candidates = towers.filter(t => Math.hypot(t.x - SOURCE.x, t.z - SOURCE.z) < 75)
    .sort(() => Math.random() - .5).slice(0, isSmall ? 30 : 46);
  const lineMat = new THREE.LineBasicMaterial({ color: COL.cyan, transparent: true, opacity: .18, blending: THREE.AdditiveBlending, depthWrite: false });
  for (const t of candidates) {
    const start = new THREE.Vector3(t.x, t.top + .3, t.z);
    const mid = start.clone().lerp(SOURCE_TOP, .5).add(new THREE.Vector3(rand(-4, 4), rand(8, 18), rand(-4, 4)));
    const curve = new THREE.CatmullRomCurve3([start, mid, SOURCE_TOP.clone().setY(9)]);
    const lut = curve.getSpacedPoints(127);
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(lut), lineMat));
    streams.push({ lut, speed: rand(.06, .12), offset: Math.random() });
  }
}
const PER_STREAM = 16;
const flowGeo = new THREE.BufferGeometry();
const flowPos = new Float32Array(streams.length * PER_STREAM * 3);
const flowCol = new Float32Array(streams.length * PER_STREAM * 3);
flowGeo.setAttribute('position', new THREE.BufferAttribute(flowPos, 3));
flowGeo.setAttribute('color', new THREE.BufferAttribute(flowCol, 3));
scene.add(new THREE.Points(flowGeo, new THREE.PointsMaterial({
  size: .55, map: dotTex, vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
})));
const tmpCol = new THREE.Color();
function updateStreams(t) {
  let k = 0;
  for (const s of streams) {
    for (let j = 0; j < PER_STREAM; j++, k++) {
      const p = (t * s.speed + s.offset + j / PER_STREAM) % 1;
      const f = p * 127, i0 = Math.floor(f), i1 = Math.min(127, i0 + 1), a = f - i0;
      const A = s.lut[i0], B = s.lut[i1];
      flowPos[k * 3] = A.x + (B.x - A.x) * a;
      flowPos[k * 3 + 1] = A.y + (B.y - A.y) * a;
      flowPos[k * 3 + 2] = A.z + (B.z - A.z) * a;
      tmpCol.copy(COL.cyan).lerp(COL.gold, p).multiplyScalar(1.4);
      flowCol[k * 3] = tmpCol.r; flowCol[k * 3 + 1] = tmpCol.g; flowCol[k * 3 + 2] = tmpCol.b;
    }
  }
  flowGeo.attributes.position.needsUpdate = true;
  flowGeo.attributes.color.needsUpdate = true;
}

// floating answer pages
const pages = [];
{
  const c = document.createElement('canvas'); c.width = 256; c.height = 340;
  const g = c.getContext('2d');
  roundRect(g, 6, 6, 244, 328, 18); g.fillStyle = 'rgba(40,90,140,.25)'; g.fill();
  g.lineWidth = 4; g.strokeStyle = 'rgba(140,225,255,.9)'; g.stroke();
  g.fillStyle = 'rgba(255,199,107,.95)'; g.fillRect(30, 36, 120, 16);
  g.fillStyle = 'rgba(170,230,255,.8)';
  for (let i = 0; i < 9; i++) g.fillRect(30, 80 + i * 26, 196 - (i % 3) * 34, 9);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const n = isSmall ? 70 : 120;
  const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1.33),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: .6, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }), n);
  for (let i = 0; i < n; i++) {
    let x; do { x = rand(-50, 50); } while (Math.abs(x) < 3);
    pages.push({ x, y: rand(0, 18), z: rand(-20, -150), ry: rand(0, 6.28), spin: rand(-.3, .3), bob: rand(0, 6.28), s: rand(.7, 1.4) });
  }
  scene.add(mesh);
  var pageMesh = mesh;
}
const pm = new THREE.Matrix4(), pq = new THREE.Quaternion(), pe = new THREE.Euler(), pv = new THREE.Vector3(), ps = new THREE.Vector3();
function updatePages(t) {
  pages.forEach((p, i) => {
    pe.set(Math.sin(t * .3 + p.bob) * .15, p.ry + t * p.spin, 0);
    pq.setFromEuler(pe);
    pv.set(p.x, p.y + Math.sin(t * .5 + p.bob) * .6, p.z);
    ps.setScalar(p.s);
    pageMesh.setMatrixAt(i, pm.compose(pv, pq, ps));
  });
  pageMesh.instanceMatrix.needsUpdate = true;
}

// ---------- camera choreography ----------
const LOOP_TARGET = new THREE.Vector3(0, 5, -90);
const ORBIT_R = 26, ORBIT_H = 9, ORBIT_A0 = .28, ORBIT_SPEED = reducedMotion ? .008 : .03;
const orbitPos = (a, out) => out.set(SOURCE.x + Math.sin(a) * ORBIT_R, ORBIT_H, SOURCE.z + Math.cos(a) * ORBIT_R);
const flyCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 0, 6.5),
  new THREE.Vector3(0, 0, -1),
  new THREE.Vector3(0, 1.8, -16),
  new THREE.Vector3(1.5, 5, -38),
  orbitPos(ORBIT_A0, new THREE.Vector3()),
]);
const DOOR_LOOK = new THREE.Vector3(0, 0, -10);
const look = new THREE.Vector3();

function updateCamera(t) {
  if (t < OPEN_END) {
    camera.position.set(0, 0, 9 - 2.5 * easeInOut(phase(t, 0, OPEN_END)));
    look.copy(DOOR_LOOK);
  } else if (t < INTRO_END) {
    camera.position.copy(flyCurve.getPointAt(easeInOut(phase(t, OPEN_END, INTRO_END))));
    look.copy(DOOR_LOOK).lerp(LOOP_TARGET, easeInOut(phase(t, OPEN_END + .4, INTRO_END)));
  } else {
    orbitPos(ORBIT_A0 + (t - INTRO_END) * ORBIT_SPEED, camera.position);
    look.copy(LOOP_TARGET);
  }
  // aim low so the source rises above the headline instead of sitting behind it
  look.y -= (camera.aspect < .8 ? 11 : 8) * easeInOut(phase(t, OPEN_END, INTRO_END));
  camera.lookAt(look);
}

// ---------- per-frame ----------
let lastBarKey = '';
function updateBar(t) {
  const n = Math.round(phase(t, .5, 2.5) * QUESTION.length);
  const caret = t < OPEN_START && (n < QUESTION.length || Math.floor(t * 2.4) % 2 === 0);
  const key = `${n}|${caret}|${fontsReady}`;
  if (key !== lastBarKey) {
    lastBarKey = key;
    drawBar(QUESTION.slice(0, n), caret);
    texL.needsUpdate = texR.needsUpdate = true;
  }
  const open = easeInOut(phase(t, OPEN_START, OPEN_END));
  doorL.rotation.y = open * 1.75;
  doorR.rotation.y = -open * 1.75;
  // light cracks through, swells as the doors part, then settles so the city shows through
  const crack = phase(t, 2.6, OPEN_START);
  seamMat.uniforms.uI.value = crack * .8 * (1 - open) + Math.sin(open * Math.PI) * .7;
  seam.scale.set(.12 + crack * .1 + open * 9, 1.1 + open * 3, 1);
  barHalo.material.opacity = .18 * (1 - open);
  // the wall dissolves behind the flash so the world opens up around the camera
  const dissolve = phase(t, 4.9, 5.7);
  wallMat.opacity = 1 - dissolve;
  for (const d of [doorL, doorR]) d.children[0].material.opacity = 1 - dissolve;
  bar.visible = camera.position.z > -1.5;
}

const flashEl = document.getElementById('flash');
const copyEl = document.getElementById('copy');

let start = performance.now();
let introOffset = reducedMotion ? INTRO_END : 0;
document.getElementById('replay').addEventListener('click', () => {
  start = performance.now(); introOffset = 0; copyEl.classList.remove('show');
});
if (reducedMotion) copyEl.classList.add('show');

function frame(now) {
  const t = seekTime ?? ((now - start) / 1000 + introOffset);
  updateCamera(t);
  updateBar(t);
  updateStreams(t);
  updatePages(t);
  towerMat.uniforms.uTime.value = t;
  beaconMat.opacity = .35 + .65 * Math.pow(.5 + .5 * Math.sin(t * 2.4), 6);
  beamMaterial.uniforms.uTime.value = t;
  sourceCrystal.rotation.y = t * .4;
  dust.rotation.y = Math.sin(t * .02) * .05;

  // white-gold flash as the camera enters the doorway
  const fd = (t - 5.3) / .4;
  flashEl.style.opacity = (Math.exp(-fd * fd) * .6).toFixed(3);
  if (t >= COPY_AT) copyEl.classList.add('show');

  composer.render();
  requestAnimationFrame(frame);
}

function resize() {
  const w = hero.clientWidth, h = hero.clientHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = camera.aspect < .8 ? 64 : 50;
  camera.updateProjectionMatrix();
  // keep the search bar inside the viewport on narrow screens
  const visW = 2 * 9 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
  bar.scale.setScalar(Math.min(1, visW * .88 / 8));
}
addEventListener('resize', resize);
resize();

if (seekTime !== null) {
  copyEl.style.transition = 'none';
  // frozen frame for screenshots: render once fonts are in
  document.fonts.ready.then(() => { fontsReady = true; lastBarKey = ''; requestAnimationFrame(frame); });
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
